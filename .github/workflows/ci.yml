name: Secure supply chain CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate example record
        run: python tools/validate_supply_chain.py
      - name: Run schema and regression tests
        run: python -m unittest discover -s tests -v
      - name: Run starter build
        run: python tools/starter_build.py
